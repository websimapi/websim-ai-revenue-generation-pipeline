<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Revenue Generation Pipeline</title>
    <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/date-fns@2.29.3/index.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .app-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 1rem 2rem;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .header h1 {
            color: #667eea;
            font-size: 1.5rem;
            font-weight: 700;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            background: #10b981;
            color: white;
            border-radius: 20px;
            font-size: 0.875rem;
            font-weight: 500;
        }

        .status-indicator.paused {
            background: #f59e0b;
        }

        .status-indicator.error {
            background: #ef4444;
        }

        .main-content {
            flex: 1;
            padding: 2rem;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 1.5rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: #374151;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .stat-item {
            text-align: center;
            padding: 1rem;
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            border-radius: 12px;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: #667eea;
            margin-bottom: 0.25rem;
        }

        .stat-label {
            font-size: 0.875rem;
            color: #64748b;
            font-weight: 500;
        }

        .content-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
        }

        .content-item {
            background: #f8fafc;
            border-radius: 12px;
            padding: 1rem;
            text-align: center;
            transition: transform 0.2s ease;
            cursor: pointer;
            border: 2px solid transparent;
        }

        .content-item:hover {
            transform: scale(1.02);
            border-color: #667eea;
        }

        .content-item.pending {
            border-color: #f59e0b;
            background: #fef3c7;
        }

        .content-item.approved {
            border-color: #10b981;
            background: #d1fae5;
        }

        .content-item.rejected {
            border-color: #ef4444;
            background: #fecaca;
        }

        .content-preview {
            width: 100%;
            height: 120px;
            background: #e5e7eb;
            border-radius: 8px;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: #9ca3af;
        }

        .content-title {
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #374151;
        }

        .content-meta {
            font-size: 0.75rem;
            color: #64748b;
            margin-bottom: 0.5rem;
        }

        .action-buttons {
            display: flex;
            gap: 0.5rem;
            justify-content: center;
        }

        .btn {
            padding: 0.5rem 1rem;
            border-radius: 8px;
            border: none;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5a67d8;
        }

        .btn-success {
            background: #10b981;
            color: white;
        }

        .btn-success:hover {
            background: #059669;
        }

        .btn-danger {
            background: #ef4444;
            color: white;
        }

        .btn-danger:hover {
            background: #dc2626;
        }

        .btn-secondary {
            background: #6b7280;
            color: white;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e5e7eb;
            border-radius: 4px;
            overflow: hidden;
            margin: 1rem 0;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 4px;
            transition: width 0.3s ease;
        }

        .generation-controls {
            display: flex;
            gap: 1rem;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .toggle-switch {
            position: relative;
            width: 60px;
            height: 30px;
            background: #e5e7eb;
            border-radius: 15px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .toggle-switch.active {
            background: #10b981;
        }

        .toggle-slider {
            position: absolute;
            top: 3px;
            left: 3px;
            width: 24px;
            height: 24px;
            background: white;
            border-radius: 50%;
            transition: transform 0.3s ease;
        }

        .toggle-switch.active .toggle-slider {
            transform: translateX(30px);
        }

        .revenue-chart {
            height: 300px;
            margin-top: 1rem;
        }

        .platform-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .platform-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            background: #f8fafc;
            border-radius: 12px;
            border-left: 4px solid #667eea;
        }

        .platform-info {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .platform-icon {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            background: #667eea;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.25rem;
        }

        .platform-stats {
            text-align: right;
        }

        .platform-revenue {
            font-size: 1.125rem;
            font-weight: 700;
            color: #10b981;
        }

        .platform-uploads {
            font-size: 0.875rem;
            color: #64748b;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: white;
            border-radius: 12px;
            padding: 1rem 1.5rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
            border-left: 4px solid #10b981;
            z-index: 1001;
            transform: translateX(100%);
            transition: transform 0.3s ease;
        }

        .notification.show {
            transform: translateX(0);
        }

        .notification.error {
            border-left-color: #ef4444;
        }

        .notification.warning {
            border-left-color: #f59e0b;
        }

        .tab-navigation {
            display: flex;
            border-bottom: 1px solid #e5e7eb;
            margin-bottom: 1.5rem;
        }

        .tab-button {
            padding: 1rem 1.5rem;
            background: none;
            border: none;
            font-size: 0.875rem;
            font-weight: 500;
            color: #64748b;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.2s ease;
        }

        .tab-button.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
                padding: 1rem;
            }
            
            .header {
                padding: 1rem;
            }
            
            .header h1 {
                font-size: 1.25rem;
            }
            
            .stats-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Initialize WebsimSocket for data persistence
        const room = new WebsimSocket();

        const App = () => {
            const [isRunning, setIsRunning] = useState(false);
            const [stats, setStats] = useState({
                totalRevenue: 0,
                todayRevenue: 0,
                contentGenerated: 0,
                pendingApproval: 0
            });
            const [pendingContent, setPendingContent] = useState([]);
            const [platforms, setPlatforms] = useState([
                { id: 'shutterstock', name: 'Shutterstock', type: 'images', revenue: 234.56, uploads: 45, icon: 'fas fa-camera' },
                { id: 'freesound', name: 'Freesound', type: 'audio', revenue: 123.45, uploads: 23, icon: 'fas fa-music' },
                { id: 'fiverr', name: 'Fiverr', type: 'services', revenue: 567.89, uploads: 12, icon: 'fas fa-briefcase' },
                { id: 'etsy', name: 'Etsy', type: 'digital', revenue: 345.67, uploads: 34, icon: 'fas fa-store' }
            ]);
            const [activeTab, setActiveTab] = useState('dashboard');
            const [notification, setNotification] = useState(null);
            const [generationProgress, setGenerationProgress] = useState(0);

            useEffect(() => {
                const initializeRoom = async () => {
                    await room.initialize();
                    loadExistingData();
                };
                initializeRoom();
            }, []);

            const loadExistingData = () => {
                const existingStats = room.collection('revenue_stats').getList();
                const existingContent = room.collection('content_queue').getList();
                
                if (existingStats.length > 0) {
                    setStats(existingStats[0]);
                }
                
                setPendingContent(existingContent);
            };

            const showNotification = (message, type = 'success') => {
                setNotification({ message, type });
                setTimeout(() => setNotification(null), 5000);
            };

            const toggleSystem = () => {
                setIsRunning(!isRunning);
                if (!isRunning) {
                    showNotification('Revenue generation system activated!');
                    startGenerationCycle();
                } else {
                    showNotification('System paused', 'warning');
                }
            };

            const startGenerationCycle = async () => {
                setGenerationProgress(0);
                
                // Simulate content generation process
                const contentTypes = ['image', 'audio', 'text'];
                const totalSteps = 5;
                
                for (let i = 0; i < totalSteps; i++) {
                    if (!isRunning) break;
                    
                    await new Promise(resolve => setTimeout(resolve, 2000));
                    setGenerationProgress((i + 1) / totalSteps * 100);
                    
                    if (i === totalSteps - 1) {
                        await generateContent();
                    }
                }
            };

            const generateContent = async () => {
                try {
                    const contentType = ['image', 'audio', 'text'][Math.floor(Math.random() * 3)];
                    let newContent;

                    switch (contentType) {
                        case 'image':
                            newContent = await generateImage();
                            break;
                        case 'audio':
                            newContent = await generateAudio();
                            break;
                        case 'text':
                            newContent = await generateText();
                            break;
                    }

                    if (newContent) {
                        const content = await room.collection('content_queue').create({
                            ...newContent,
                            status: 'pending',
                            created_at: new Date().toISOString(),
                            estimated_revenue: Math.random() * 50 + 10
                        });

                        setPendingContent(prev => [...prev, content]);
                        setStats(prev => ({
                            ...prev,
                            contentGenerated: prev.contentGenerated + 1,
                            pendingApproval: prev.pendingApproval + 1
                        }));

                        showNotification(`New ${contentType} content generated!`);
                    }
                } catch (error) {
                    console.error('Generation error:', error);
                    showNotification('Content generation failed', 'error');
                }
            };

            const generateImage = async () => {
                const prompts = [
                    'Abstract digital art with vibrant colors',
                    'Minimalist geometric pattern',
                    'Nature landscape photography style',
                    'Modern architectural design',
                    'Futuristic technology concept'
                ];
                
                const prompt = prompts[Math.floor(Math.random() * prompts.length)];
                
                try {
                    const result = await websim.imageGen({
                        prompt: prompt,
                        aspect_ratio: "1:1"
                    });
                    
                    return {
                        type: 'image',
                        title: prompt,
                        preview: result.url,
                        platforms: ['shutterstock', 'etsy'],
                        tags: ['digital art', 'stock photo', 'creative']
                    };
                } catch (error) {
                    console.error('Image generation failed:', error);
                    return null;
                }
            };

            const generateAudio = async () => {
                const audioTypes = [
                    'Upbeat background music for videos',
                    'Relaxing ambient soundscape',
                    'Professional voice-over narration',
                    'Sound effect for games',
                    'Podcast intro music'
                ];
                
                const text = audioTypes[Math.floor(Math.random() * audioTypes.length)];
                
                try {
                    const result = await websim.textToSpeech({
                        text: "This is a sample audio content for the revenue generation system.",
                        voice: "en-male"
                    });
                    
                    return {
                        type: 'audio',
                        title: text,
                        preview: result.url,
                        platforms: ['freesound', 'fiverr'],
                        tags: ['audio', 'music', 'sound effect']
                    };
                } catch (error) {
                    console.error('Audio generation failed:', error);
                    return null;
                }
            };

            const generateText = async () => {
                const textTypes = [
                    'Blog article about technology trends',
                    'Product description for e-commerce',
                    'Social media marketing copy',
                    'Technical documentation',
                    'Creative writing piece'
                ];
                
                const topic = textTypes[Math.floor(Math.random() * textTypes.length)];
                
                try {
                    const completion = await websim.chat.completions.create({
                        messages: [
                            {
                                role: "system",
                                content: "Generate high-quality content for commercial use."
                            },
                            {
                                role: "user",
                                content: `Create a ${topic} (approximately 200 words)`
                            }
                        ]
                    });
                    
                    return {
                        type: 'text',
                        title: topic,
                        preview: completion.content.substring(0, 100) + '...',
                        platforms: ['fiverr', 'etsy'],
                        tags: ['content', 'writing', 'commercial']
                    };
                } catch (error) {
                    console.error('Text generation failed:', error);
                    return null;
                }
            };

            const approveContent = async (contentId) => {
                try {
                    await room.collection('content_queue').update(contentId, {
                        status: 'approved',
                        approved_at: new Date().toISOString()
                    });

                    setPendingContent(prev => prev.map(item => 
                        item.id === contentId ? { ...item, status: 'approved' } : item
                    ));

                    // Simulate revenue generation
                    const revenue = Math.random() * 50 + 10;
                    setStats(prev => ({
                        ...prev,
                        totalRevenue: prev.totalRevenue + revenue,
                        todayRevenue: prev.todayRevenue + revenue,
                        pendingApproval: prev.pendingApproval - 1
                    }));

                    showNotification(`Content approved! Estimated revenue: $${revenue.toFixed(2)}`);
                } catch (error) {
                    showNotification('Failed to approve content', 'error');
                }
            };

            const rejectContent = async (contentId) => {
                try {
                    await room.collection('content_queue').update(contentId, {
                        status: 'rejected',
                        rejected_at: new Date().toISOString()
                    });

                    setPendingContent(prev => prev.map(item => 
                        item.id === contentId ? { ...item, status: 'rejected' } : item
                    ));

                    setStats(prev => ({
                        ...prev,
                        pendingApproval: prev.pendingApproval - 1
                    }));

                    showNotification('Content rejected', 'warning');
                } catch (error) {
                    showNotification('Failed to reject content', 'error');
                }
            };

            const renderDashboard = () => (
                <>
                    <div className="card">
                        <div className="card-header">
                            <h3 className="card-title">
                                <i className="fas fa-chart-line"></i>
                                Revenue Overview
                            </h3>
                        </div>
                        <div className="stats-grid">
                            <div className="stat-item">
                                <div className="stat-value">${stats.totalRevenue.toFixed(2)}</div>
                                <div className="stat-label">Total Revenue</div>
                            </div>
                            <div className="stat-item">
                                <div className="stat-value">${stats.todayRevenue.toFixed(2)}</div>
                                <div className="stat-label">Today's Revenue</div>
                            </div>
                            <div className="stat-item">
                                <div className="stat-value">{stats.contentGenerated}</div>
                                <div className="stat-label">Content Generated</div>
                            </div>
                            <div className="stat-item">
                                <div className="stat-value">{stats.pendingApproval}</div>
                                <div className="stat-label">Pending Approval</div>
                            </div>
                        </div>
                        <div className="generation-controls">
                            <div 
                                className={`toggle-switch ${isRunning ? 'active' : ''}`}
                                onClick={toggleSystem}
                            >
                                <div className="toggle-slider"></div>
                            </div>
                            <span>Auto-Generation {isRunning ? 'Active' : 'Paused'}</span>
                        </div>
                        {generationProgress > 0 && (
                            <div className="progress-bar">
                                <div 
                                    className="progress-fill" 
                                    style={{ width: `${generationProgress}%` }}
                                ></div>
                            </div>
                        )}
                    </div>

                    <div className="card">
                        <div className="card-header">
                            <h3 className="card-title">
                                <i className="fas fa-upload"></i>
                                Platform Performance
                            </h3>
                        </div>
                        <div className="platform-list">
                            {platforms.map(platform => (
                                <div key={platform.id} className="platform-item">
                                    <div className="platform-info">
                                        <div className="platform-icon">
                                            <i className={platform.icon}></i>
                                        </div>
                                        <div>
                                            <div style={{ fontWeight: '600' }}>{platform.name}</div>
                                            <div style={{ fontSize: '0.875rem', color: '#64748b' }}>
                                                {platform.type}
                                            </div>
                                        </div>
                                    </div>
                                    <div className="platform-stats">
                                        <div className="platform-revenue">
                                            ${platform.revenue.toFixed(2)}
                                        </div>
                                        <div className="platform-uploads">
                                            {platform.uploads} uploads
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </>
            );

            const renderContentQueue = () => (
                <div className="card full-width">
                    <div className="card-header">
                        <h3 className="card-title">
                            <i className="fas fa-tasks"></i>
                            Content Approval Queue
                        </h3>
                        <button className="btn btn-primary" onClick={generateContent}>
                            <i className="fas fa-plus"></i> Generate Content
                        </button>
                    </div>
                    <div className="content-grid">
                        {pendingContent.map(content => (
                            <div 
                                key={content.id} 
                                className={`content-item ${content.status}`}
                            >
                                <div className="content-preview">
                                    {content.type === 'image' && <i className="fas fa-image"></i>}
                                    {content.type === 'audio' && <i className="fas fa-music"></i>}
                                    {content.type === 'text' && <i className="fas fa-file-text"></i>}
                                </div>
                                <div className="content-title">{content.title}</div>
                                <div className="content-meta">
                                    Type: {content.type} | Revenue: ${content.estimated_revenue?.toFixed(2)}
                                </div>
                                <div className="content-meta">
                                    Platforms: {content.platforms?.join(', ')}
                                </div>
                                {content.status === 'pending' && (
                                    <div className="action-buttons">
                                        <button 
                                            className="btn btn-success"
                                            onClick={() => approveContent(content.id)}
                                        >
                                            <i className="fas fa-check"></i>
                                        </button>
                                        <button 
                                            className="btn btn-danger"
                                            onClick={() => rejectContent(content.id)}
                                        >
                                            <i className="fas fa-times"></i>
                                        </button>
                                    </div>
                                )}
                                {content.status === 'approved' && (
                                    <div style={{ color: '#10b981', fontWeight: '600', fontSize: '0.875rem' }}>
                                        ✓ Approved & Uploaded
                                    </div>
                                )}
                                {content.status === 'rejected' && (
                                    <div style={{ color: '#ef4444', fontWeight: '600', fontSize: '0.875rem' }}>
                                        ✗ Rejected
                                    </div>
                                )}
                            </div>
                        ))}
                    </div>
                </div>
            );

            return (
                <div className="app-container">
                    <header className="header">
                        <h1>
                            <i className="fas fa-robot"></i>
                            AI Revenue Generation Pipeline
                        </h1>
                        <div className={`status-indicator ${isRunning ? 'active' : 'paused'}`}>
                            <i className={`fas ${isRunning ? 'fa-play' : 'fa-pause'}`}></i>
                            {isRunning ? 'System Active' : 'System Paused'}
                        </div>
                    </header>

                    <main className="main-content">
                        <div className="card full-width">
                            <div className="tab-navigation">
                                <button 
                                    className={`tab-button ${activeTab === 'dashboard' ? 'active' : ''}`}
                                    onClick={() => setActiveTab('dashboard')}
                                >
                                    <i className="fas fa-tachometer-alt"></i> Dashboard
                                </button>
                                <button 
                                    className={`tab-button ${activeTab === 'queue' ? 'active' : ''}`}
                                    onClick={() => setActiveTab('queue')}
                                >
                                    <i className="fas fa-tasks"></i> Content Queue ({stats.pendingApproval})
                                </button>
                                <button 
                                    className={`tab-button ${activeTab === 'analytics' ? 'active' : ''}`}
                                    onClick={() => setActiveTab('analytics')}
                                >
                                    <i className="fas fa-chart-bar"></i> Analytics
                                </button>
                            </div>
                        </div>

                        {activeTab === 'dashboard' && renderDashboard()}
                        {activeTab === 'queue' && renderContentQueue()}
                        {activeTab === 'analytics' && renderDashboard()}
                    </main>

                    {notification && (
                        <div className={`notification show ${notification.type}`}>
                            <div style={{ display: 'flex', alignItems: 'center', gap: '0.5rem' }}>
                                <i className={`fas ${
                                    notification.type === 'success' ? 'fa-check-circle' :
                                    notification.type === 'error' ? 'fa-exclamation-circle' :
                                    'fa-exclamation-triangle'
